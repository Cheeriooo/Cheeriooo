<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Inference readout for the model rakesh-sawant: prompt 'who are you' returns 'I build AI systems, tools, and workflows that actually ship.' Hallucination risk 4 percent, within tolerance." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="reveal-a"><rect x="40" y="120" width="0" height="30"><animate attributeName="width" values="0;0;520" keyTimes="0;0.22;0.72" dur="7s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath>
    <clipPath id="reveal-b"><rect x="40" y="152" width="0" height="30"><animate attributeName="width" values="0;0;300" keyTimes="0;0.62;0.86" dur="7s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath>
    <clipPath id="card"><rect x="8" y="8" width="864" height="284" rx="14"/></clipPath>
  </defs>

  <style>
    :root { color-scheme: light dark; }
    .bg   { fill: #16181F; }
    .rule { stroke: #2A2E3A; stroke-width: 1; }
    .dim  { fill: #6F7686; }
    .body { fill: #E4E7EE; }
    .warm { fill: #C2864A; }
    .cool { fill: #4FA39B; }
    .barbg{ fill: #262A35; }
    text  { font-family: "IBM Plex Mono", "SF Mono", "Menlo", ui-monospace, monospace; }
    .lbl  { font-size: 12px; letter-spacing: 0.06em; }
    .out  { font-size: 19px; }
    .meta { font-size: 12.5px; }
    .big  { font-size: 15px; font-weight: 600; }
    @media (prefers-color-scheme: light) {
      .bg{fill:#FBFAF7} .rule{stroke:#E0DCD3} .dim{fill:#8A8578} .body{fill:#22242A}
      .warm{fill:#A5713F} .cool{fill:#3B807A} .barbg{fill:#ECE8E0}
    }
    @media (prefers-reduced-motion: reduce) { animate, animateTransform { display: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect class="bg" x="0" y="0" width="880" height="300"/>

    <!-- header -->
    <text class="dim lbl" x="40" y="46">MODEL</text>
    <text class="body big" x="112" y="46">rakesh-sawant</text>
    <text class="dim lbl" x="262" y="46">· fp16 · always-on · Earth</text>
    <circle class="cool" cx="820" cy="41" r="5">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text class="dim lbl" x="740" y="46">serving</text>
    <line class="rule" x1="40" y1="64" x2="840" y2="64"/>

    <!-- prompt -->
    <text class="warm meta" x="40" y="96">&gt;&gt;&gt;  what do you do?</text>

    <!-- streamed output -->
    <g clip-path="url(#reveal-a)">
      <text class="body out" x="40" y="141">I build AI systems, tools, and workflows</text>
    </g>
    <g clip-path="url(#reveal-b)">
      <text class="body out" x="40" y="173">that actually ship.</text>
    </g>
    <rect class="warm" x="40" y="157" width="9" height="20">
      <animate attributeName="x" values="40;40;560;60;340;340" keyTimes="0;0.22;0.72;0.74;0.86;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="125;125;125;157;157;157" keyTimes="0;0.22;0.71;0.72;0.86;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- readout -->
    <line class="rule" x1="40" y1="212" x2="840" y2="212"/>
    <text class="dim lbl" x="40" y="242">hallucination risk</text>
    <rect class="barbg" x="176" y="232" width="300" height="8" rx="4"/>
    <rect class="cool" x="176" y="232" width="0" height="8" rx="4">
      <animate attributeName="width" values="0;0;12" keyTimes="0;0.74;0.95" dur="7s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.86;0.96" dur="7s" repeatCount="indefinite"/>
      <text class="cool meta" x="492" y="242">4%  — within tolerance</text>
    </g>
    <text class="dim lbl" x="40" y="270">latency</text>
    <text class="body meta" x="176" y="270">one long weekend</text>
    <text class="dim lbl" x="560" y="270">temperature</text>
    <text class="body meta" x="672" y="270">0.7, on purpose</text>

    <rect x="8" y="8" width="864" height="284" rx="14" fill="none" class="rule"/>
  </g>
</svg>
